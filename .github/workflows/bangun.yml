name: Bangun APK

# Berjalan hanya kalau pesan commit memuat kata [bangun], supaya dorongan biasa
# tidak memakai menit Actions. Contoh:
#   git commit --allow-empty -m "Bangun APK [bangun]" && git push
on:
  push:
    branches: [bangun]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bangun]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang NDK dan platform Android
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.0.12077973" "platforms;android-36" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Pasang kunci tanda tangan tetap
        shell: bash
        env:
          KUNCI: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KUNCI" ]; then
            mkdir -p "$HOME/.android"
            echo "$KUNCI" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Memakai kunci tanda tangan tetap."
          else
            echo "Rahasia DEBUG_KEYSTORE_B64 belum ada: memakai kunci sementara."
          fi

      - name: Bangun
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -Pevvdroid.abis=arm64-v8a \
            -Pevvdroid.rules=bytecode \
            -Pevvdroid.langs=lang/enus \
            -Pevvdroid.abiSplits=false \
            --no-daemon 2>&1 | tee build.txt

      - name: Sidik jari tanda tangan
        if: success()
        shell: bash
        run: |
          AS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$AS" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - name: Simpan APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Eloquence-Indo
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error

      - name: Simpan catatan build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catatan-build
          path: build.txt
          retention-days: 1
